<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cart | Pushapa Jewellers</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Common CSS -->
    <link rel="stylesheet" href="style.css">


    <style>

        /* =====================================================
           CART PAGE
        ===================================================== */

        


        .cart-section {
            padding: 100px 5% 60px;
            min-height: 100vh;
        }


        /* =====================================================
           TITLE
        ===================================================== */

        .cart-title {
            text-align: center;
            margin-bottom: 45px;
        }

        .cart-title h1 {
            font-family: "Cinzel", serif;
            color: #d4af37;
            font-size: 42px;
            margin: 0 0 8px;
            letter-spacing: 2px;
        }

        .cart-title p {
            color: #aaa;
            font-family: "Poppins", sans-serif;
            margin: 0;
            font-size: 14px;
        }


        /* =====================================================
           CART GRID
        ===================================================== */

        .cart-grid {
            width: 100%;
            max-width: 1400px;
            margin: auto;

            display: grid;
            grid-template-columns:
                repeat(4, minmax(0, 1fr));

            gap: 28px;
        }


        /* =====================================================
           PRODUCT CARD
           SAME STYLE AS PRODUCT PAGE
        ===================================================== */

        .cart-grid .product-card {

            position: relative;

            background: #080808;

            border: 1px solid #6f5510;

            border-radius: 16px;

            overflow: hidden;

            box-shadow:
                0 0 0 transparent;

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease,
                border-color 0.3s ease;
        }


        .cart-grid .product-card:hover {

            transform: translateY(-5px);

            border-color: #d4af37;

            box-shadow:
                0 12px 35px rgba(212, 175, 55, 0.15);
        }


        /* =====================================================
           IMAGE
        ===================================================== */

        .cart-grid .product-image-wrap {

            position: relative;

            width: 100%;
            height: 350px;

            overflow: hidden;

            background: #fff;
        }


        .cart-grid .product-image-wrap img {

            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;

            transition:
                transform 0.5s ease;
        }


        .cart-grid .product-card:hover
        .product-image-wrap img {

            transform: scale(1.03);
        }


        /* =====================================================
           WISHLIST
        ===================================================== */

        .cart-grid .product-wishlist-btn {

            position: absolute;

            top: 14px;
            right: 12px;

            width: 86px;
            height: 36px;

            border-radius: 30px;

            background: #050505;

            border: 1px solid #d4af37;

            color: #d4af37;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            z-index: 5;

            transition: 0.3s ease;
        }


        .cart-grid .product-wishlist-btn i {

            color: #d4af37;

            font-size: 17px;
        }


        .cart-grid .product-wishlist-btn.active {

            background: #d4af37;

            border-color: #d4af37;
        }


        .cart-grid
        .product-wishlist-btn.active i {

            color: #000;
        }


        /* =====================================================
           CARD CONTENT
        ===================================================== */

        .cart-grid .product-card-content {

            padding: 16px 24px 18px;

            background: #080808;
        }


        /* =====================================================
           CATEGORY
        ===================================================== */

        .cart-grid .product-category {

            color: #d4af37;

            font-family: "Poppins", sans-serif;

            font-size: 12px;

            font-weight: 700;

            letter-spacing: 3px;

            margin-bottom: 10px;
        }


        /* =====================================================
           NAME
        ===================================================== */

        .cart-grid .product-name {

            color: #f5e7b2;

            font-family: "Cinzel", serif;

            font-size: 23px;

            font-weight: 700;

            margin: 0 0 12px;

            line-height: 1.2;
        }


        /* =====================================================
           RATING
        ===================================================== */

        .cart-grid .product-rating {

            display: flex;

            align-items: center;

            gap: 12px;

            margin-bottom: 12px;
        }


        .cart-grid .stars {

            color: #d4af37;

            font-size: 16px;

            letter-spacing: 1px;
        }


        .cart-grid .rating-number {

            color: #bbb;

            font-size: 12px;
        }


        /* =====================================================
           PRICE
        ===================================================== */

        .cart-grid .price {

            color: #fff;

            font-family: "Poppins", sans-serif;

            font-size: 22px;

            font-weight: 600;

            margin: 0 0 18px;
        }


        /* =====================================================
           BUTTONS
        ===================================================== */

        .cart-grid .product-buttons {

            display: flex;

            gap: 10px;

            width: 100%;
        }


        .cart-grid .product-buttons button {

            height: 52px;

            flex: 1;

            border-radius: 7px;

            font-family: "Poppins", sans-serif;

            font-size: 12px;

            font-weight: 600;

            letter-spacing: 0.5px;

            cursor: pointer;

            transition: 0.3s ease;
        }


        /* VIEW DETAILS */

        .cart-grid .view-btn {

            background:
                linear-gradient(
                    135deg,
                    #ffe27a,
                    #d4af37
                );

            border: 1px solid #d4af37;

            color: #080808;
        }


        .cart-grid .view-btn:hover {

            background:
                linear-gradient(
                    135deg,
                    #fff0a5,
                    #e1bd4b
                );

            transform: translateY(-2px);
        }

/* ==========================================
   REMOVE BUTTON - PREMIUM LUXURY
========================================== */

.cart-grid .remove-cart-btn {
    flex: 1;

    height: 52px;

    background: transparent;

    border: 1px solid #8d6f18;

    border-radius: 7px;

    color: #d4af37;

    font-family: "Poppins", sans-serif;

    font-size: 11px;

    font-weight: 600;

    letter-spacing: 2px;

    cursor: pointer;

    transition: all 0.3s ease;

    white-space: nowrap;
}


.cart-grid .remove-cart-btn:hover {

    background: #d4af37;

    border-color: #d4af37;

    color: #050505;

    box-shadow:
        0 5px 18px rgba(212,175,55,0.25);

    transform: translateY(-2px);
}

        /* =====================================================
           EMPTY CART
        ===================================================== */

        .empty-cart {

            display: none;

            text-align: center;

            padding: 80px 20px;

            color: #aaa;
        }


        .empty-cart i {

            color: #d4af37;

            font-size: 55px;

            margin-bottom: 20px;
        }


        .empty-cart h2 {

            color: #f5e7b2;

            font-family: "Cinzel", serif;

            font-size: 28px;

            margin-bottom: 10px;
        }


        .empty-cart p {

            margin-bottom: 25px;
        }


        .shop-btn {

            display: inline-flex;

            align-items: center;
            justify-content: center;

            padding: 13px 28px;

            background:
                linear-gradient(
                    135deg,
                    #ffe27a,
                    #d4af37
                );

            color: #000;

            text-decoration: none;

            border-radius: 6px;

            font-weight: 600;

            font-size: 13px;
        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 1100px) {

            .cart-grid {
                grid-template-columns:
                    repeat(3, minmax(0, 1fr));
            }

        }


        @media (max-width: 800px) {

            .cart-grid {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));

                gap: 18px;
            }

            .cart-grid .product-image-wrap {
                height: 280px;
            }

            .cart-grid .product-card-content {
                padding: 14px 16px;
            }

            .cart-grid .product-name {
                font-size: 18px;
            }

            .cart-grid .price {
                font-size: 19px;
            }

        }


        /* ==========================================
   MOBILE CART - 2 CARDS IN ONE ROW
========================================== */

@media (max-width: 520px) {

    .cart-section {
        padding: 90px 8px 40px;
    }

    .cart-title {
        margin-bottom: 25px;
    }

    .cart-title h1 {
        font-size: 28px;
        letter-spacing: 2px !important;
    }

    .cart-title p {
        font-size: 11px;
    }

    /* 2 CARDS IN ONE ROW */
    .cart-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
        gap: 10px !important;
        width: 100%;
        max-width: 100%;
    }

    /* CARD */
    .cart-grid .product-card {
        width: 100%;
        min-width: 0;
        border-radius: 10px;
    }

    /* IMAGE */
    .cart-grid .product-image-wrap {
        height: 190px;
    }

    .cart-grid .product-image-wrap img {
        object-fit: cover;
    }

    /* WISHLIST HEART */
    .cart-grid .product-wishlist-btn {
        width: 32px;
        height: 32px;
        top: 7px;
        right: 7px;
        border-radius: 50%;
    }

    .cart-grid .product-wishlist-btn i {
        font-size: 13px;
    }

    /* CONTENT */
    .cart-grid .product-card-content {
        padding: 10px;
    }

    /* CATEGORY */
    .cart-grid .product-category {
        font-size: 8px;
        letter-spacing: 1px;
        margin-bottom: 5px;
    }

    /* PRODUCT NAME */
    .cart-grid .product-name {
        font-size: 13px;
        line-height: 1.3;
        margin-bottom: 7px;
    }

    /* RATING */
    .cart-grid .product-rating {
        gap: 4px;
        margin-bottom: 7px;
    }

    .cart-grid .stars {
        font-size: 10px;
        letter-spacing: 0;
    }

    .cart-grid .rating-number {
        font-size: 9px;
    }

    /* PRICE */
    .cart-grid .price {
        font-size: 14px;
        margin-bottom: 10px;
    }

    /* BUTTONS */
    .cart-grid .product-buttons {
        gap: 5px;
    }

    .cart-grid .product-buttons button {
        height: 34px;
        font-size: 8px;
        padding: 0 3px;
        letter-spacing: 0;
        border-radius: 5px;
    }

    .cart-grid .view-btn,
    .cart-grid .remove-cart-btn {
        font-size: 8px !important;
        letter-spacing: 0 !important;
        padding: 0 3px !important;
    }

}


/* ==========================================
   VERY SMALL PHONES
========================================== */

@media (max-width: 360px) {

    .cart-section {
        padding-left: 6px;
        padding-right: 6px;
    }

    .cart-grid {
        gap: 7px !important;
    }

    .cart-grid .product-image-wrap {
        height: 165px;
    }

    .cart-grid .product-card-content {
        padding: 8px;
    }

    .cart-grid .product-name {
        font-size: 12px;
    }

    .cart-grid .price {
        font-size: 13px;
    }

    .cart-grid .product-buttons button {
        height: 32px;
        font-size: 7px;
    }

}

   PREMIUM CART PAGE BACKGROUND

===================================================== -->

<script src="script.js"></script>


<script>



// =====================================================
// GET CART
// =====================================================

function getCartProducts() {

    try {

        return JSON.parse(
            localStorage.getItem("cart")
        ) || [];

    }

    catch (error) {

        return [];

    }

}



// =====================================================
// SAVE CART
// =====================================================

function saveCartProducts(cart) {

    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );

}



// =====================================================
// LOAD CART
// =====================================================

function loadCart() {


    const cart =
        getCartProducts();


    const container =
        document.getElementById(
            "cartContainer"
        );


    const empty =
        document.getElementById(
            "emptyCart"
        );


    container.innerHTML = "";


    // =================================================
    // EMPTY
    // =================================================

    if (cart.length === 0) {

        empty.style.display = "block";

        if (
            typeof updateCartCount ===
            "function"
        ) {

            updateCartCount();

        }

        return;

    }


    empty.style.display = "none";


    // =================================================
    // PRODUCTS
    // =================================================

    cart.forEach(
        function (product, index) {


            const card =
                document.createElement("div");


            card.className =
                "product-card";

const originalProductName =
    product.name ||
    product.title ||
    "JEWELLERY";

const productName =
    String(originalProductName)
        .replace(/\s*\d+\s*$/, "")
        .trim()
        .toUpperCase();
            const category =
                product.category ||
                product.type ||
                "JEWELLERY";


            const price =
                Number(
                    product.price
                ) || 0;


            const image =
                product.image || "";


            card.innerHTML = `


                <!-- IMAGE -->

                <div class="product-image-wrap">

                    <img
                        src="${image}"
                        alt="${productName}"
                        loading="lazy"
                    >


                    <!-- WISHLIST -->

                    <button
                        class="product-wishlist-btn"
                        type="button"
                    >

                        <i class="fa-regular fa-heart"></i>

                    </button>

                </div>



                <!-- CONTENT -->

                <div class="product-card-content">


                    <div class="product-category">

                        ${String(category).toUpperCase()}

                    </div>


                    <h3 class="product-name">

                        ${productName}

                    </h3>


                    <div class="product-rating">

                        <span class="stars">

                            ★★★★★

                        </span>

                        <span class="rating-number">

                            5.0

                        </span>

                    </div>


                    <p class="price">

                        ₹${price.toLocaleString("en-IN")}

                    </p>


                    <div class="product-buttons">


                        <!-- VIEW DETAILS -->

                        <button
                            class="view-btn"
                            type="button"
                        >

                            VIEW DETAILS

                        </button>


                        <!-- REMOVE -->

                        <button
                            class="remove-cart-btn"
                            type="button"
                        >

                            REMOVE 

                        </button>


                    </div>

                </div>

            `;


            // =================================================
            // VIEW DETAILS
            // =================================================

            const viewButton =
                card.querySelector(
                    ".view-btn"
                );


            viewButton.addEventListener(
                "click",
                function () {


                    localStorage.setItem(

                        "selectedProduct",

                        JSON.stringify({

                            ...product,

                            name:
                                productName,

                            price:
                                price,

                            image:
                                image

                        })

                    );


                    window.location.href =
                        "view-details.html";


                }
            );



            // =================================================
            // REMOVE FROM CART
            // =================================================

            const removeButton =
                card.querySelector(
                    ".remove-cart-btn"
                );


            removeButton.addEventListener(
                "click",
                function () {


                    let currentCart =
                        getCartProducts();


                    currentCart.splice(
                        index,
                        1
                    );


                    saveCartProducts(
                        currentCart
                    );


                    loadCart();


                    if (
                        typeof updateCartCount ===
                        "function"
                    ) {

                        updateCartCount();

                    }

                }
            );



            // =================================================
            // WISHLIST
            // =================================================

            const wishlistButton =
                card.querySelector(
                    ".product-wishlist-btn"
                );


            const wishlistIcon =
                wishlistButton.querySelector(
                    "i"
                );


            let wishlist = [];

            try {

                wishlist =
                    JSON.parse(
                        localStorage.getItem(
                            "wishlist"
                        )
                    ) || [];

            }

            catch (error) {

                wishlist = [];

            }


            const alreadyInWishlist =
                wishlist.some(
                    item =>
                        item.name ===
                        productName
                );


            if (
                alreadyInWishlist
            ) {

                wishlistButton.classList.add(
                    "active"
                );

                wishlistIcon.classList.remove(
                    "fa-regular"
                );

                wishlistIcon.classList.add(
                    "fa-solid"
                );

            }


            wishlistButton.addEventListener(
                "click",
                function (event) {


                    event.preventDefault();

                    event.stopPropagation();


                    let currentWishlist =
                        JSON.parse(
                            localStorage.getItem(
                                "wishlist"
                            )
                        ) || [];


                    const existingIndex =
                        currentWishlist.findIndex(
                            item =>
                                item.name ===
                                productName
                        );


                    // REMOVE WISHLIST

                    if (
                        existingIndex !== -1
                    ) {

                        currentWishlist.splice(
                            existingIndex,
                            1
                        );


                        wishlistButton.style.setProperty(
                            "background",
                            "#050505",
                            "important"
                        );


                        wishlistButton.style.setProperty(
                            "border-color",
                            "#d4af37",
                            "important"
                        );


                        wishlistIcon.classList.remove(
                            "fa-solid"
                        );


                        wishlistIcon.classList.add(
                            "fa-regular"
                        );


                        wishlistIcon.style.setProperty(
                            "color",
                            "#d4af37",
                            "important"
                        );


                        wishlistButton.classList.remove(
                            "active"
                        );

                    }


                    // ADD WISHLIST

                    else {

                        currentWishlist.push({

                            name:
                                productName,

                            image:
                                image,

                            price:
                                price

                        });


                        wishlistButton.style.setProperty(
                            "background",
                            "#d4af37",
                            "important"
                        );


                        wishlistButton.style.setProperty(
                            "border-color",
                            "#d4af37",
                            "important"
                        );


                        wishlistIcon.classList.remove(
                            "fa-regular"
                        );


                        wishlistIcon.classList.add(
                            "fa-solid"
                        );


                        wishlistIcon.style.setProperty(
                            "color",
                            "#000000",
                            "important"
                        );


                        wishlistButton.classList.add(
                            "active"
                        );

                    }


                    localStorage.setItem(
                        "wishlist",
                        JSON.stringify(
                            currentWishlist
                        )
                    );


                }
            );


            container.appendChild(card);

        }
    );


    if (
        typeof updateCartCount ===
        "function"
    ) {

        updateCartCount();

    }

}



// =====================================================
// PAGE LOAD
