<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cart | Pushapa Jewellers</title>

    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- FONT AWESOME -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- COMMON CSS -->
    <link rel="stylesheet" href="style.css">


    <style>

        /* =====================================================
           CART PAGE BACKGROUND
        ===================================================== */

        body.cart-page {

            min-height: 100vh;

            background-image:
                linear-gradient(
                    90deg,
                    rgba(0,0,0,0.93) 0%,
                    rgba(0,0,0,0.76) 50%,
                    rgba(0,0,0,0.90) 100%
                ),
                url("./images/aboutt.jpg") !important;

            background-size: cover !important;
            background-position: center center !important;
            background-repeat: no-repeat !important;
            background-attachment: fixed !important;
        }


        /* =====================================================
           CART SECTION
        ===================================================== */

        .cart-section {

            padding: 100px 5% 60px;

            min-height: 100vh;
        }


        /* =====================================================
           CART TITLE
        ===================================================== */

        .cart-title {

            text-align: center;

            margin-bottom: 45px;
        }

        .cart-title h1 {

            font-family: "Cinzel", serif;

            color: #d4af37;

            font-size: 42px;

            margin: 0 0 8px;

            letter-spacing: 4px;

            text-shadow:
                0 0 15px rgba(212,175,55,0.18);
        }

        .cart-title p {

            color: #9b927d;

            font-family: "Poppins", sans-serif;

            margin: 0;

            font-size: 14px;

            letter-spacing: 1px;
        }

        .cart-title::after {

            content: "";

            display: block;

            width: 70px;

            height: 1px;

            background: #d4af37;

            margin: 18px auto 0;

            box-shadow:
                0 0 10px rgba(212,175,55,0.35);
        }


        /* =====================================================
           CART GRID
        ===================================================== */

        .cart-grid {

            width: 100%;

            max-width: 1400px;

            margin: auto;

            display: grid;

            grid-template-columns:
                repeat(4, minmax(0, 1fr));

            gap: 28px;
        }


        /* =====================================================
           PRODUCT CARD
        ===================================================== */

        .cart-grid .product-card {

            position: relative;

            background: #080808;

            border: 1px solid #6f5510;

            border-radius: 16px;

            overflow: hidden;

            box-shadow: 0 0 0 transparent;

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease,
                border-color 0.3s ease;
        }

        .cart-grid .product-card:hover {

            transform: translateY(-5px);

            border-color: #d4af37;

            box-shadow:
                0 12px 35px rgba(212,175,55,0.15);
        }


        /* =====================================================
           PRODUCT IMAGE
        ===================================================== */

        .cart-grid .product-image-wrap {

            position: relative;

            width: 100%;

            height: 350px;

            overflow: hidden;

            background: #fff;
        }

        .cart-grid .product-image-wrap img {

            width: 100%;

            height: 100%;

            object-fit: cover;

            display: block;

            transition:
                transform 0.5s ease;
        }

        .cart-grid .product-card:hover
        .product-image-wrap img {

            transform: scale(1.03);
        }


        /* =====================================================
           WISHLIST BUTTON
        ===================================================== */

        .cart-grid .product-wishlist-btn {

            position: absolute;

            top: 14px;

            right: 12px;

            width: 86px;

            height: 36px;

            border-radius: 30px;

            background: #d4af37 !important;

            border: 1px solid #d4af37 !important;

            color: #000;

            display: flex;

            align-items: center;

            justify-content: center;

            cursor: pointer;

            z-index: 5;

            transition: 0.3s ease;
        }

        .cart-grid .product-wishlist-btn i {

            color: #000 !important;

            font-size: 17px;
        }

        .cart-grid .product-wishlist-btn:hover {

            transform: scale(1.05);
        }


        /* =====================================================
           CARD CONTENT
        ===================================================== */

        .cart-grid .product-card-content {

            padding: 16px 24px 18px;

            background: #080808;
        }


        /* CATEGORY */

        .cart-grid .product-category {

            color: #d4af37;

            font-family: "Poppins", sans-serif;

            font-size: 12px;

            font-weight: 700;

            letter-spacing: 3px;

            margin-bottom: 10px;
        }


        /* PRODUCT NAME */

        .cart-grid .product-name {

            color: #f5e7b2;

            font-family: "Cinzel", serif;

            font-size: 23px;

            font-weight: 700;

            margin: 0 0 12px;

            line-height: 1.2;
        }


        /* RATING */

        .cart-grid .product-rating {

            display: flex;

            align-items: center;

            gap: 12px;

            margin-bottom: 12px;
        }

        .cart-grid .stars {

            color: #d4af37;

            font-size: 16px;

            letter-spacing: 1px;
        }

        .cart-grid .rating-number {

            color: #bbb;

            font-size: 12px;
        }


        /* PRICE */

        .cart-grid .price {

            color: #fff;

            font-family: "Poppins", sans-serif;

            font-size: 22px;

            font-weight: 600;

            margin: 0 0 18px;
        }


        /* =====================================================
           BUTTONS
        ===================================================== */

        .cart-grid .product-buttons {

            display: flex;

            gap: 10px;

            width: 100%;
        }

        .cart-grid .product-buttons button {

            height: 52px;

            flex: 1;

            border-radius: 7px;

            font-family: "Poppins", sans-serif;

            font-size: 11px;

            font-weight: 600;

            letter-spacing: 1px;

            cursor: pointer;

            transition: 0.3s ease;

            white-space: nowrap;

            display: flex;

            align-items: center;

            justify-content: center;

            line-height: 1;
        }


        /* VIEW DETAILS */

        .cart-grid .view-btn {

            background:
                linear-gradient(
                    135deg,
                    #B8860B,
                    #D4AF37,
                    #F0D77A
                ) !important;

            border: 1px solid #D4AF37 !important;

            color: #111 !important;

            padding: 0 12px;

            font-weight: 700;
        }

        .cart-grid .view-btn:hover {

            background:
                linear-gradient(
                    135deg,
                    #D4AF37,
                    #F0D77A,
                    #D4AF37
                ) !important;

            transform: translateY(-2px);
        }


        /* REMOVE */

        .cart-grid .remove-cart-btn {

            background: #080808 !important;

            border: 1px solid #D4AF37 !important;

            color: #D4AF37 !important;

            padding: 0 12px;
        }

        .cart-grid .remove-cart-btn:hover {

            background: #D4AF37 !important;

            border-color: #D4AF37 !important;

            color: #111 !important;

            box-shadow:
                0 5px 18px rgba(212,175,55,0.25);

            transform: translateY(-2px);
        }


        /* =====================================================
           EMPTY CART
        ===================================================== */

        .empty-cart {

            display: none;

            text-align: center;

            padding: 80px 20px;

            color: #aaa;
        }

        .empty-cart i {

            color: #d4af37;

            font-size: 55px;

            margin-bottom: 20px;
        }

        .empty-cart h2 {

            color: #f5e7b2;

            font-family: "Cinzel", serif;

            font-size: 28px;

            margin-bottom: 10px;
        }

        .empty-cart p {

            margin-bottom: 25px;
        }


        /* =====================================================
           SHOP BUTTON
        ===================================================== */

        .shop-btn {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            padding: 13px 28px;

            background:
                linear-gradient(
                    135deg,
                    #ffe27a,
                    #d4af37
                );

            color: #000;

            text-decoration: none;

            border-radius: 6px;

            font-weight: 600;

            font-size: 13px;
        }


        /* =====================================================
           TABLET
        ===================================================== */

        @media (max-width: 1100px) {

            .cart-grid {

                grid-template-columns:
                    repeat(3, minmax(0, 1fr));
            }
        }


        @media (max-width: 800px) {

            .cart-grid {

                grid-template-columns:

            }

            .cart-grid .product-name {

           MOBILE - 2 CARDS

            .cart-grid .product-name {

            .cart-grid .product-rating {

            .cart-grid .stars {

            .cart-grid .price {

            .cart-grid .product-buttons {

            }

            .cart-grid .product-wishlist-btn {

                width: 32px;

     CART SCRIPT

<script>

/* =====================================================
   GET CART
===================================================== */

function getCartProducts() {

    try {

        return JSON.parse(
            localStorage.getItem("cart")
        ) || [];

    }

    catch (error) {

        return [];

    }

}



/* =====================================================
   LOAD CART
===================================================== */

function loadCart() {

    const cart =
        getCartProducts();


    const container =
        document.getElementById(
            "cartContainer"
        );


    const empty =
        document.getElementById(
            "emptyCart"
        );


    container.innerHTML = "";


    /* =================================================
       EMPTY CART
    ================================================= */

    if (cart.length === 0) {

        empty.style.display = "block";


        if (
            typeof updateCartCount ===
            "function"
        ) {

            updateCartCount();

        }

        return;

    }


    empty.style.display = "none";


    /* =================================================
       PRODUCTS
    ================================================= */

    cart.forEach(
        function(product, index) {


            const card =
                document.createElement("div");


            card.className =
                "product-card";


            /* =========================================
               ORIGINAL NAME
            ========================================= */

            const originalProductName =
                product.name ||
                product.title ||
                "JEWELLERY";


            /* =========================================
               CLEAN NAME
            ========================================= */

            const productName =
                String(originalProductName)
                    .replace(/\s*\d+\s*$/, "")
                    .trim()
                    .toUpperCase();


            /* =========================================
               CATEGORY
            ========================================= */

            const category =
                product.category ||
                product.type ||
                "JEWELLERY";


            /* =========================================
               PRICE
            ========================================= */

            const price =
                Number(product.price) || 0;


            /* =========================================
               IMAGE
            ========================================= */

            const image =
                product.image || "";


            /* =========================================
               CARD HTML
            ========================================= */

            card.innerHTML = `

                <div class="product-image-wrap">

                    <img
                        src="${image}"
                        alt="${productName}"
                        loading="lazy"
                    >


                    <button
                        class="product-wishlist-btn"
                        type="button"
                        title="Add to Wishlist"
                    >

                        <i class="fa-regular fa-heart"></i>

                    </button>

                </div>


                <div class="product-card-content">

                    <div class="product-category">

                        ${String(category).toUpperCase()}

                    </div>


                    <h3 class="product-name">

                        ${productName}

                    </h3>


                    <div class="product-rating">

                        <span class="stars">
                            ★★★★★
                        </span>

                        <span class="rating-number">
                            5.0
                        </span>

                    </div>


                    <p class="price">

                        ₹${price.toLocaleString("en-IN")}

                    </p>


                    <div class="product-buttons">

                        <button
                            class="view-btn"
                            type="button"
                        >
                            VIEW DETAILS
                        </button>


                        <button
                            class="remove-cart-btn"
                            type="button"
                        >
                            REMOVE
                        </button>

                    </div>

                </div>

            `;


            /* =================================================
               VIEW DETAILS
            ================================================= */

            const viewButton =
                card.querySelector(
                    ".view-btn"
                );


            viewButton.addEventListener(
                "click",
                function() {

                    localStorage.setItem(

                        "selectedProduct",

                        JSON.stringify({

                            ...product,

                            name:
                                productName,

                            price:
                                price,

                            image:
                                image

                        })

                    );


                    window.location.href =
                        "view-details.html";

                }
            );



            /* =================================================
               REMOVE FROM CART
            ================================================= */

            const removeButton =
                card.querySelector(
                    ".remove-cart-btn"
                );


            removeButton.addEventListener(
                "click",
                function() {


                    let currentCart =
                        getCartProducts();


                    currentCart.splice(
                        index,
                        1
                    );


                    localStorage.setItem(

                        "cart",

                        JSON.stringify(
                            currentCart
                        )

                    );


                    if (
                        typeof updateCartCount ===
                        "function"
                    ) {

                        updateCartCount();

                    }


                    if (
                        typeof showPremiumAlert ===
                        "function"
                    ) {

                        showPremiumAlert(
                            "Product removed from cart!",
                            "cart"
                        );

                    }


                    loadCart();

                }
            );



            /* =================================================
               ADD TO WISHLIST
            ================================================= */

            const wishlistButton =
                card.querySelector(
                    ".product-wishlist-btn"
                );


            wishlistButton.addEventListener(
                "click",
                function(event) {

                    event.preventDefault();

                    event.stopPropagation();


                    let wishlist = [];


                    try {

                        wishlist =
                            JSON.parse(
                                localStorage.getItem(
                                    "wishlist"
                                )
                            ) || [];

                    }

                    catch(error) {

                        wishlist = [];

                    }


                    /* =========================================
                       CHECK EXISTING
                    ========================================= */

                    const alreadyExists =
                        wishlist.some(
                            item =>
                                item.name ===
                                originalProductName
                        );


                    /* =========================================
                       ADD TO WISHLIST
                    ========================================= */

                    if (!alreadyExists) {

                        wishlist.push({

                            name:
                                originalProductName,

                            image:
                                image,

                            price:
                                price,

                            category:
                                category

                        });


                        localStorage.setItem(

                            "wishlist",

                            JSON.stringify(
                                wishlist
                            )

                        );


                        wishlistButton.innerHTML =
                            `<i class="fa-solid fa-heart"></i>`;


                        wishlistButton.title =
                            "Added to Wishlist";


                        if (
                            typeof showPremiumAlert ===
                            "function"
                        ) {

                            showPremiumAlert(
                                "Product added to wishlist!",
                                "wishlist"
                            );

                        }

                    }

                    else {

                        if (
                            typeof showPremiumAlert ===
                            "function"
                        ) {

                            showPremiumAlert(
                                "Product is already in wishlist!",
                                "wishlist"
                            );

                        }

                    }

                }
            );


            /* =================================================
               ADD CARD
            ================================================= */

            container.appendChild(card);

        }
    );

}



/* =====================================================
   PAGE LOAD
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        loadCart();


        if (
            typeof updateCartCount ===
            "function"
        ) {

            updateCartCount();

        }

    }
);

</script>


</body>

</html>
