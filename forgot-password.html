<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | Pushapa Jewellers</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
            background:
                linear-gradient(rgba(0, 0, 0, 0.72), rgba(0, 0, 0, 0.88)),
                url("images/hero.jpg") center/cover no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            padding: 20px;
        }

        .forgot-container {
            width: 100%;
            max-width: 450px;
            padding: 45px 40px;
            background: rgba(10, 10, 10, 0.92);
            border: 1px solid rgba(255, 215, 0, 0.45);
            border-radius: 18px;
            box-shadow:
                0 0 25px rgba(255, 215, 0, 0.15),
                0 20px 60px rgba(0, 0, 0, 0.7);
            text-align: center;
        }

        .logo-icon {
            width: 75px;
            height: 75px;
            margin: 0 auto 20px;
            border: 2px solid #d4af37;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffd700;
            font-size: 30px;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.25);
        }

        .forgot-container h1 {
            font-family: 'Cinzel', serif;
            color: #ffd700;
            font-size: 27px;
            margin-bottom: 10px;
        }

        .forgot-container .subtitle {
            color: #ccc;
            font-size: 14px;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .input-box {
            position: relative;
            margin-bottom: 20px;
        }

        .input-box i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #d4af37;
        }

        .input-box input {
            width: 100%;
            height: 52px;
            padding: 0 15px 0 48px;
            background: #111;
            border: 1px solid #444;
            border-radius: 8px;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        .input-box input:focus {
            border-color: #ffd700;
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.18);
        }

        .input-box input::placeholder {
            color: #888;
        }

        .reset-btn {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #d4af37, #ffd700);
            color: #000;
            font-family: 'Poppins', sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .reset-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 215, 0, 0.25);
        }

        .reset-btn i {
            margin-right: 8px;
        }

        #message {
            margin-top: 18px;
            font-size: 13px;
            min-height: 20px;
        }

        .back-login {
            margin-top: 25px;
        }

        .back-login a {
            color: #ffd700;
            text-decoration: none;
            font-size: 14px;
        }

        .back-login a:hover {
            text-decoration: underline;
        }

        /* Mobile */
        @media (max-width: 500px) {

            body {
                padding: 15px;
            }

            .forgot-container {
                padding: 35px 22px;
            }

            .forgot-container h1 {
                font-size: 23px;
            }

            .forgot-container .subtitle {
                font-size: 13px;
            }

            .logo-icon {
                width: 65px;
                height: 65px;
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <div class="forgot-container">

        <div class="logo-icon">
            <i class="fa-solid fa-lock"></i>
        </div>

        <h1>Forgot Password?</h1>

        <p class="subtitle">
            Enter your registered email address and we'll help you
            reset your password.
        </p>

        <form id="forgotForm">

            <div class="input-box">
                <i class="fa-solid fa-envelope"></i>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your registered email"
                    required
                >
            </div>

            <button type="submit" class="reset-btn">
    <i class="fa-solid fa-paper-plane"></i>
    Send OTP
</button>

        </form>

        <div id="message"></div>

        <div class="back-login">
            <a href="login.html">
                <i class="fa-solid fa-arrow-left"></i>
                Back to Login
            </a>
        </div>

    </div>


    <script>

    let userEmail = "";


    // =====================================================
    // SEND OTP
    // =====================================================

    document.getElementById("forgotForm").addEventListener("submit", async function (e) {

        e.preventDefault();

        const email =
            document.getElementById("email").value.trim();

        const message =
            document.getElementById("message");

        const button =
            document.querySelector(".reset-btn");


        if (!email) {

            message.style.color = "#ff5555";

            message.innerText =
                "Please enter your email address.";

            return;
        }


        button.disabled = true;

        button.innerHTML =
            '<i class="fa-solid fa-spinner fa-spin"></i> Sending...';


        try {

            const response = await fetch(
                "http://localhost:5000/api/auth/forgot-password",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email: email
                    })
                }
            );


            const data = await response.json();


            if (!response.ok) {

                message.style.color = "#ff5555";

                message.innerText =
                    data.message ||
                    "Something went wrong.";

                button.disabled = false;

                button.innerHTML =
                    '<i class="fa-solid fa-paper-plane"></i> Send OTP';

                return;
            }


            // Save email
            userEmail = email;


            // Hide email form
            document.getElementById("forgotForm").style.display =
                "none";


            // Change heading
            document.querySelector(".forgot-container h1").innerText =
                "Reset Password";


            document.querySelector(".subtitle").innerText =
                "Enter the OTP sent to your email and create a new password.";


            // Add OTP + password section
            const resetSection = document.createElement("div");

            resetSection.id = "resetSection";

            resetSection.innerHTML = `

                <div style="
                    color:#ffd700;
                    font-size:13px;
                    margin-bottom:20px;
                    word-break:break-word;
                ">
                    OTP sent to: ${email}
                </div>


                <!-- OTP -->

                <div class="input-box">

                    <i class="fa-solid fa-key"></i>

                    <input
                        type="text"
                        id="otp"
                        placeholder="Enter 6 digit OTP"
                        maxlength="6"
                        inputmode="numeric"
                        required
                    >

                </div>


                <!-- NEW PASSWORD -->

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="newPassword"
                        placeholder="Enter new password"
                        minlength="6"
                        required
                    >

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm new password"
                        minlength="6"
                        required
                    >

                </div>


                <button
                    type="button"
                    class="reset-btn"
                    id="resetPasswordBtn"
                >

                    <i class="fa-solid fa-key"></i>

                    Reset Password

                </button>

            `;


            document
                .querySelector(".forgot-container")
                .insertBefore(
                    resetSection,
                    document.getElementById("message")
                );


            message.style.color = "#00ff88";

            message.innerText =
                "OTP sent successfully. Check your email.";


            // Reset button event
            document
                .getElementById("resetPasswordBtn")
                .addEventListener("click", resetPassword);


        }

        catch (error) {

            console.error(error);

            message.style.color = "#ff5555";

            message.innerText =
                "Server connection failed.";

        }


        button.disabled = false;

        button.innerHTML =
            '<i class="fa-solid fa-paper-plane"></i> Send OTP';

    });



    // =====================================================
    // RESET PASSWORD
    // =====================================================

    async function resetPassword() {

        const otp =
            document.getElementById("otp").value.trim();

        const newPassword =
            document.getElementById("newPassword").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;

        const message =
            document.getElementById("message");

        const button =
            document.getElementById("resetPasswordBtn");


        // OTP validation

        if (!otp) {

            message.style.color = "#ff5555";

            message.innerText =
                "Please enter the OTP.";

            return;

        }


        if (otp.length !== 6) {

            message.style.color = "#ff5555";

            message.innerText =
                "Please enter a valid 6 digit OTP.";

            return;

        }


        // Password validation

        if (!newPassword) {

            message.style.color = "#ff5555";

            message.innerText =
                "Please enter a new password.";

            return;

        }


        if (newPassword.length < 6) {

            message.style.color = "#ff5555";

            message.innerText =
                "Password must be at least 6 characters.";

            return;

        }


        if (newPassword !== confirmPassword) {

            message.style.color = "#ff5555";

            message.innerText =
                "Passwords do not match.";

            return;

        }


        button.disabled = true;

        button.innerHTML =
            '<i class="fa-solid fa-spinner fa-spin"></i> Resetting...';


        try {

            const response = await fetch(
                "http://localhost:5000/api/auth/reset-password",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({

                        email: userEmail,

                        otp: otp,

                        newPassword: newPassword

                    })
                }
            );


            const data = await response.json();


            if (!response.ok) {

                message.style.color = "#ff5555";

                message.innerText =
                    data.message ||
                    "Invalid or expired OTP.";

                button.disabled = false;

                button.innerHTML =
                    '<i class="fa-solid fa-key"></i> Reset Password';

                return;

            }


            message.style.color = "#00ff88";

            message.innerText =
                "Password reset successfully!";


            button.innerHTML =
                '<i class="fa-solid fa-check"></i> Password Reset';


            // Go to login
            setTimeout(() => {

                window.location.href = "login.html";

            }, 1800);


        }

        catch (error) {

            console.error(error);

            message.style.color = "#ff5555";

            message.innerText =
                "Server connection failed.";

            button.disabled = false;

            button.innerHTML =
                '<i class="fa-solid fa-key"></i> Reset Password';

        }

    }

</script>

</body>

</html>
