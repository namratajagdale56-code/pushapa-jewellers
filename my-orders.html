    <style>

        /* =====================================================
           MY ORDERS ONLY
        ===================================================== */

        body.my-orders-page {

            background:
                radial-gradient(
                    circle at 80% 0%,
                    rgba(212,175,55,0.08),
                    transparent 30%
                ),
                #080808;

            color: #fff;

            min-height: 100vh;
        }


        /* =====================================================
           PAGE
        ===================================================== */

        .orders-wrapper {

            width: 90%;

            max-width: 1050px;

            margin: 0 auto;

            padding: 55px 0 80px;
        }


        /* =====================================================
           HEADING
        ===================================================== */

        .orders-title {

            text-align: center;

            margin-bottom: 42px;
        }


        .orders-title .brand-small {

            color: #d4af37;

            font-size: 12px;

            letter-spacing: 5px;

            text-transform: uppercase;
        }


        .orders-title h1 {

            margin: 9px 0;

            color: #f5d76e;

            font-family: Georgia, serif;

            font-size: 42px;

            font-weight: 500;
        }


        .title-line {

            width: 75px;

            height: 1px;

            margin: 14px auto;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #d4af37,
                    transparent
                );
        }


        .orders-title p {

            color: #888;

            font-size: 13px;

            margin: 0;
        }


        /* =====================================================
           ORDER CARD
        ===================================================== */

        .order-card {

            position: relative;

            display: flex;

            align-items: center;

            width: 100%;

            min-height: 175px;

            padding: 20px 22px;

            margin-bottom: 22px;

            box-sizing: border-box;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.045),
                    rgba(255,255,255,0.012)
                );

            border:
                1px solid rgba(212,175,55,0.27);

            border-radius: 14px;

            overflow: hidden;

            transition: 0.3s ease;

            box-shadow:
                0 8px 25px rgba(0,0,0,0.25);
        }


        .order-card::before {

            content: "";

            position: absolute;

            left: 0;

            top: 0;

            width: 3px;

            height: 100%;

            background:
                linear-gradient(
                    to bottom,
                    transparent,
                    #d4af37,
                    transparent
                );
        }


        .order-card:hover {

            border-color:
                rgba(212,175,55,0.55);

            transform: translateY(-2px);

            box-shadow:
                0 15px 35px rgba(0,0,0,0.4);
        }


        /* =====================================================
           PRODUCT IMAGE
        ===================================================== */

        .order-image {

            width: 135px;

            height: 135px;

            flex-shrink: 0;

            overflow: hidden;

            border-radius: 11px;

            background: #111;

            border:
                1px solid rgba(212,175,55,0.4);

            box-shadow:
                0 6px 18px rgba(0,0,0,0.3);
        }


        .order-image img {

            width: 100%;

            height: 100%;

            object-fit: cover;

            display: block;

            transition: 0.35s ease;
        }


        .order-card:hover .order-image img {

            transform: scale(1.04);
        }


        /* =====================================================
           ORDER CONTENT
        ===================================================== */

        .order-content {

            flex: 1;

            min-width: 0;

            padding: 0 25px;
        }


        /* ORDER ID */

        .order-id {

            color: #d4af37;

            font-size: 11px;

            font-weight: 600;

            letter-spacing: 0.7px;

            margin-bottom: 5px;
        }


        /* DATE */

        .order-date {

            color: #777;

            font-size: 11px;

            margin-bottom: 10px;
        }


        .order-date i {

            color: #a88728;

            margin-right: 5px;
        }


        /* PRODUCT NAME */

        .product-name {

            color: #f5d76e;

            font-family: Georgia, serif;

            font-size: 23px;

            font-weight: 500;

            margin-bottom: 6px;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }


        /* TYPE */

        .product-type {

            color: #999;

            font-size: 12px;

            margin-bottom: 10px;
        }


        .product-type i {

            color: #c39d2f;

            margin-right: 5px;
        }


        /* INFO */

        .order-info {

            display: flex;

            align-items: center;

            gap: 22px;
        }


        .order-info span {

            color: #999;

            font-size: 11px;
        }


        .order-info i {

            color: #b48e29;

            margin-right: 5px;
        }


        .order-price {

            color: #fff !important;

            font-size: 18px !important;

            font-weight: 600;
        }


        /* DELIVERY */

        .delivery {

            color: #777;

            font-size: 11px;

            margin-top: 9px;
        }


        .delivery i {

            color: #d4af37;

            margin-right: 5px;
        }


        .delivery strong {

            color: #d1b044;

            font-weight: 500;
        }


        /* =====================================================
           RIGHT SIDE
        ===================================================== */

        .order-actions {

            width: 190px;

            min-width: 190px;

            height: 135px;

            display: flex;

            flex-direction: column;

            align-items: flex-end;

            justify-content: space-between;
        }


        /* STATUS */

        .status {

            display: inline-flex;

            align-items: center;

            gap: 6px;

            padding: 7px 13px;

            border-radius: 30px;

            color: #f0cf5c;

            background:
                rgba(212,175,55,0.07);

            border:
                1px solid rgba(212,175,55,0.4);

            font-size: 9px;

            font-weight: 600;

            letter-spacing: 0.8px;

            text-transform: uppercase;
        }


        .status i {

            color: #d4af37;

            font-size: 8px;
        }


        /* =====================================================
           BUTTONS
        ===================================================== */

        .buttons {

            display: flex;

            gap: 8px;
        }


        .buttons button {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 6px;

            padding: 9px 13px;

            border-radius: 6px;

            cursor: pointer;

            font-size: 10px;

            transition: 0.3s ease;
        }


        /* VIEW */

        .view-btn {

            background:
                linear-gradient(
                    135deg,
                    #d4af37,
                    #f5d76e
                );

            border:
                1px solid #d4af37;

            color: #111;

            font-weight: 600;
        }


        .view-btn:hover {

            box-shadow:
                0 5px 18px rgba(212,175,55,0.2);
        }


        /* REORDER */

        .reorder-btn {

            background: transparent;

            border:
                1px solid rgba(212,175,55,0.45);

            color: #d9b94d;
        }


        .reorder-btn:hover {

            background:
                rgba(212,175,55,0.1);

            border-color: #d4af37;
        }


        /* =====================================================
           EMPTY ORDERS
        ===================================================== */

        .empty-orders {

            text-align: center;

            padding: 75px 25px;

            border:
                1px solid rgba(212,175,55,0.25);

            border-radius: 14px;

            background:
                rgba(255,255,255,0.02);
        }


        .empty-orders i {

            color: #d4af37;

            font-size: 48px;

            margin-bottom: 18px;
        }


        .empty-orders h2 {

            color: #f5d76e;

            font-family: Georgia, serif;

            font-size: 25px;

            font-weight: 500;

            margin: 0 0 8px;
        }


        .empty-orders p {

            color: #777;

            font-size: 13px;

            margin-bottom: 22px;
        }


        .shop-button {

            display: inline-flex;

            align-items: center;

            gap: 8px;

            padding: 11px 20px;

            background:
                linear-gradient(
                    135deg,
                    #d4af37,
                    #f5d76e
                );

            color: #111;

            text-decoration: none;

            border-radius: 6px;

            font-size: 11px;

            font-weight: 600;
        }


        /* =====================================================

        ===================================================== */

        @media (max-width: 850px) {

            .order-card {

                gap: 15px;

                min-height: auto;

                padding: 15px;

            .order-image {

            .order-content {

            .order-actions {

            }


            .buttons {

                width: auto;

            .buttons button {

            .delivery {

            .status {

                padding: 5px 8px;

                font-size: 8px;
            }


            .buttons button {

                padding: 8px 9px;

                font-size: 9px;
            }

        }

<header>

<nav class="navbar">

    <!-- Logo Left Side -->

        <a href="index.html">
            <div class="logo">
                <img src="images/logo.png" alt="Pushapa Jewellers">

        ☰

</li>

</header>



<!-- =====================================================
     PAGE CONTENT
===================================================== -->

<main class="orders-wrapper">


    <div class="orders-title">

        <div class="brand-small">
            Pushapa Jewellers
        </div>


        <h1>
            My Orders
        </h1>


        <div class="title-line"></div>


        <p>
            Track your jewellery orders and delivery details
        </p>

    </div>


    <div id="orders-container"></div>


</main>


<script src="script.js"></script>


<script>

document.addEventListener("DOMContentLoaded", function () {


    const container =
        document.getElementById("orders-container");


    let orders =
        JSON.parse(localStorage.getItem("orders")) || [];


    /* NEWEST ORDER FIRST */

    orders.reverse();


    /* =====================================================
       NO ORDERS
    ===================================================== */

    if (orders.length === 0) {

        container.innerHTML = `

            <div class="empty-orders">

                <i class="fa-solid fa-box-open"></i>

                <h2>
                    No Orders Yet
                </h2>

                <p>
                    Your jewellery journey starts here.
                </p>

                <a
                    href="product.html"
                    class="shop-button">

                    <i class="fa-solid fa-gem"></i>

                    Explore Jewellery

                </a>

            </div>

        `;

        return;
    }


    /* =====================================================
       ORDERS
    ===================================================== */

    orders.forEach(function (order) {


        const product =
            order.product || {};


        const image =
            product.image ||
            "images/logo.png";


        container.innerHTML += `

            <div class="order-card">


                <!-- PRODUCT IMAGE -->

                <div class="order-image">

                    <img
                        src="${image}"
                        alt="${product.name || "Jewellery Product"}"
                    >

                </div>


                <!-- ORDER CONTENT -->

                <div class="order-content">


                    <div class="order-id">

                        ORDER #${order.orderId || "N/A"}

                    </div>


                    <div class="order-date">

                        <i class="fa-regular fa-calendar"></i>

                        Ordered on
                        ${order.orderDate || "N/A"}

                    </div>


                    <div class="product-name">

                        ${product.name || "Jewellery Product"}

                    </div>


                    <div class="product-type">

                        <i class="fa-solid fa-gem"></i>

                        Premium Jewellery

                    </div>


                    <div class="order-info">


                        <span>

                            <i class="fa-solid fa-box"></i>

                            Quantity:
                            ${product.quantity || 1}

                        </span>


                        <span class="order-price">

                            ${product.price || "₹0"}

                        </span>

                    </div>


                    <div class="delivery">

                        <i class="fa-solid fa-truck-fast"></i>

                        Expected Delivery:

                        <strong>
                            5–7 Business Days
                        </strong>

                    </div>


                </div>


                <!-- STATUS + ACTIONS -->

                <div class="order-actions">


                    <div class="status">

                        <i class="fa-solid fa-circle-check"></i>

                        ${order.status || "Confirmed"}

                    </div>


                    <div class="buttons">


                        <button
                            class="view-btn"
                            onclick="viewOrderDetails('${order.orderId}')">

                            <i class="fa-solid fa-eye"></i>

                            View Details

                        </button>


                        <button
                            class="reorder-btn"
                            onclick="reorder('${order.orderId}')">

                            <i class="fa-solid fa-rotate-right"></i>

                            Reorder

                        </button>


                    </div>


                </div>


            </div>

        `;

    });

});


/* =====================================================
   VIEW ORDER DETAILS
===================================================== */

function viewOrderDetails(orderId) {


    const orders =
        JSON.parse(localStorage.getItem("orders")) || [];


    const order =
        orders.find(function (item) {

            return item.orderId === orderId;

        });


    if (!order) {

        alert("Order details not found.");

        return;
    }


    localStorage.setItem(
        "selectedOrderId",
        orderId
    );


    window.location.href =
        "order-details.html";

}


/* =====================================================
   REORDER
===================================================== */

function reorder(orderId) {


    const orders =
        JSON.parse(localStorage.getItem("orders")) || [];


    const order =
        orders.find(function (item) {

            return item.orderId === orderId;

        });


    if (!order || !order.product) {

        alert("Product information not found.");

        return;
    }


    const product = {

        name: order.product.name,

        image: order.product.image,

        price: order.product.price

    };


    localStorage.setItem(
        "selectedProduct",
        JSON.stringify(product)
    );


    window.location.href =
        "buy-now.html";

}

</script>
