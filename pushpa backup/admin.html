        /* ===== PROFESSIONAL ADMIN DESIGN ===== */

    border-radius:30px;
    padding:14px;

    max-width:700px;

    margin-top:30px;

input, select{
    height:50px;
    font-size:16px;
}

    margin-top:20px;
}

    display:flex;
    align-items:center;
    gap:20px;

/* Product Image */

    width:120px;
    height:120px;

    object-fit:cover;

    border-radius:15px;

}


/* Product Name */

    flex:1;

    color:#333;

    margin:0;

}


/* Price */

.product-card p{

    font-size:18px;

    color:#b8860b;

}


/* Buttons */

    width:auto;

    padding:10px 25px;

/* Update Button */

    background:#b8860b;

/* Delete Button */

    background:#8b0000;

<body>

<div class="box">

<div class="admin-header">

   <img src="images/logo.png" class="admin-logo">

    <h1>Pushapa Jewellers</h1>

    <button onclick="logout()">
        Logout
    </button>

</div>

<h2>Add Product</h2>

<input type="text" id="productName" placeholder="Product Name">

<input type="number" id="price" placeholder="Price">

<input type="text" id="image" placeholder="Image URL">

<select id="category">
    <option>Ring</option>
    <option>Necklace</option>
    <option>Bangles</option>
    <option>Earring</option>
    <option>Bracelet</option>
    <option>Mangalsutra</option>
    <option>Chain</option>
    <option>Pendant</option>
</select>

<button onclick="addProduct()">Add Product</button>
<button id="updateBtn" onclick="updateProduct()" style="display:none;">
Update Product
</button>
<p id="msg"></p>
<hr>

<hr>
<div class="manage-title">

    <h2>Manage Products</h2>

    <span id="totalCount">
        Total Products: 0
    </span>

</div>


<button onclick="showProducts()">
    View All Products
</button>
<input 
type="text" 
id="searchBox" 
placeholder="Search Product..."
onkeyup="searchProducts()">


<select id="filterCategory" onchange="filterProducts()">
    <option value="All">All Categories</option>
    <option value="Ring">Ring</option>
    <option value="Necklace">Necklace</option>
    <option value="Bangles">Bangles</option>
    <option value="Earring">Earring</option>
    <option value="Bracelet">Bracelet</option>
    <option value="Mangalsutra">Mangalsutra</option>
    <option value="Chain">Chain</option>
    <option value="Pendant">Pendant</option>
</select>
<div id="product-list"></div>

</div>

<script>
    let editId = null;
    let allProducts = [];

// Update button click केल्यावर form मध्ये data आणणे

function editProduct(id){

    editId = id;

    fetch("http://localhost:5000/products")
    .then(res=>res.json())
    .then(products=>{

        let product = products.find(p=>p._id === id);


        document.getElementById("productName").value = product.name;
        document.getElementById("price").value = product.price;
        document.getElementById("image").value = product.image;
        document.getElementById("category").value = product.category;


        document.querySelector("button[onclick='addProduct()']").style.display="none";

        document.getElementById("updateBtn").style.display="block";


        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    });

}



// Update Product Save

async function updateProduct(){

    const name = document.getElementById("productName").value;
    const price = document.getElementById("price").value;
    const image = document.getElementById("image").value;
    const category = document.getElementById("category").value;


    await fetch(
        `http://localhost:5000/products/${editId}`,
        {
            method:"PUT",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                name,
                price,
                image,
                category
            })
        }
    );


    alert("Product Updated Successfully");


    document.getElementById("updateBtn").style.display="none";

    document.querySelector("button[onclick='addProduct()']").style.display="block";


    document.getElementById("productName").value="";
    document.getElementById("price").value="";
    document.getElementById("image").value="";


    loadProducts();

}
    // LOAD PRODUCTS

async function loadProducts(){

    const response = await fetch("http://localhost:5000/products");

    const products = await response.json();
    allProducts = products;
    
    let html = "";

    products.forEach(product => {

        
        html += `

<div class="product-card">

<img src="${
product.image 
? (product.image.startsWith('http') 
    ? product.image 
    : 'http://localhost:5000/' + product.image)
: 'images/logo.png'
}" width="80">

<h3>${product.name}</h3>

<p>₹${product.price}</p>

<button onclick="editProduct('${product._id}')">
Update
</button>

<button onclick="deleteProduct('${product._id}')">
Delete
</button>

</div>

`;
    });


console.log(products);
console.log(html);
    document.getElementById("product-list").innerHTML = html;
console.log(products);
console.log(html);

document.getElementById("totalCount").innerHTML =
"Total Products: " + products.length;

}


function showProducts(){
    loadProducts();
}

// DELETE PRODUCT

async function deleteProduct(id){

    let confirmDelete = confirm(
        "Are you sure you want to delete this product?"
    );


    if(confirmDelete){

        await fetch(
    `http://localhost:5000/products/${id}`,
    {
        method:"DELETE"
    }
);


        alert("Product Deleted");
        loadProducts();

        

    }

}


// page open झाल्यावर products दाखवणे


async function addProduct(){

    const name = document.getElementById("productName").value;
    const price = document.getElementById("price").value;
    const image = document.getElementById("image").value;
    const category = document.getElementById("category").value;

    const response = await fetch("http://localhost:5000/add-product",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body: JSON.stringify({
            name,
            price,
            image,
            category
        })
    });

    const data = await response.json();
    document.getElementById("msg").innerHTML = data.message;
    loadProducts();
}

function logout(){

    let confirmLogout = confirm("Logout from Admin Panel?");

    if(confirmLogout){

        localStorage.removeItem("adminLogin");

        window.location.href="login.html";

    }

}

</script>
</body>
</html>
