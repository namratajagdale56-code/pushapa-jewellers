<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pushapa Jewellers | Cart</title>

    <link rel="stylesheet" href="style.css">

    <style>

        /* =====================================================
           CART PAGE
        ===================================================== */

        .cart-section {
            padding: 50px 5%;
            min-height: 80vh;
        }

        .cart-section h1 {
            text-align: center;
            color: #ffd700;
            font-family: "Cinzel", serif;
            margin-bottom: 35px;
        }


        /* =====================================================
           MOBILE NAVBAR
        ===================================================== */

        .mobile-menu-btn {
            display: none;
            background: transparent;
            border: none;
            color: #ffd700;
            font-size: 32px;
            cursor: pointer;
            padding: 5px;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 768px) {

            header {
                position: relative;
                z-index: 99999;
            }

            .navbar {
                position: relative !important;
                z-index: 99999 !important;

                display: flex !important;
                align-items: center !important;
                justify-content: space-between !important;
            }


            /* LOGO */

            .logo {
                display: flex !important;
                align-items: center !important;
                gap: 10px !important;
            }

            .logo img {
                width: 55px !important;
                height: 55px !important;
                object-fit: contain;
            }

            .logo h2 {
                font-size: 18px !important;
                white-space: nowrap;
            }


            /* HAMBURGER */

            .mobile-menu-btn {
                display: block !important;
                font-size: 32px;
                line-height: 1;
                z-index: 100001;
            }


            /* =================================================
               NAVIGATION MENU
            ================================================= */

            .nav-links {
                position: absolute !important;

                top: 100% !important;
                left: 0 !important;
                right: 0 !important;

                width: 100% !important;

                display: none !important;

                flex-direction: column !important;
                align-items: flex-start !important;

                background: #080808 !important;

                padding: 20px 28px 25px !important;
                margin: 0 !important;

                box-sizing: border-box !important;

                border-top: 1px solid #8f751b !important;
                border-bottom: 1px solid #8f751b !important;

                z-index: 100000 !important;

                list-style: none !important;
            }


            /* OPEN MENU */

            .nav-links.active {
                display: flex !important;
            }


            /* MENU ITEMS */

            .nav-links li {
                width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
            }


            .nav-links li a {
                display: block !important;

                width: 100% !important;

                padding: 13px 0 !important;

                color: #ffffff !important;

                font-size: 18px !important;
                font-weight: 500 !important;

                text-decoration: none !important;

                text-align: left !important;

                background: transparent !important;
            }


            .nav-links li a:hover {
                color: #ffd700 !important;
            }


            /* =================================================
               CART CONTENT
            ================================================= */

            .cart-section {
                position: relative;
                z-index: 1;

                padding: 35px 12px !important;
            }

            .cart-section h1 {
                font-size: 30px !important;
                margin-bottom: 25px !important;
            }

        }


        /* =====================================================
           SMALL MOBILE
        ===================================================== */

        @media (max-width: 400px) {

            .logo img {
                width: 48px !important;
                height: 48px !important;
            }

            .logo h2 {
                font-size: 15px !important;
            }

            .mobile-menu-btn {
                font-size: 29px !important;
            }

            .cart-section h1 {
                font-size: 26px !important;
            }

        }

    </style>

</head>


<body class="cart-page">


<!-- =====================================================
     HEADER
===================================================== -->

<header>

    <nav class="navbar">


        <!-- LOGO -->

        <div class="logo">

            <img
                src="images/logo.png"
                alt="Pushapa Jewellers Logo"
            >

            <h2>Pushapa Jewellers</h2>

        </div>


        <!-- MOBILE HAMBURGER -->

        <button
            class="mobile-menu-btn"
            id="mobileMenuBtn"
            aria-label="Open Menu"
            type="button"
        >
            ☰
        </button>


        <!-- NAVIGATION -->

        <ul class="nav-links" id="navLinks">

            <li>
                <a href="index.html">Home</a>
            </li>

            <li>
                <a href="login.html">Login</a>
            </li>

            <li>
                <a href="product.html">Product</a>
            </li>

            <li>
                <a href="cart.html">Cart</a>
            </li>

            <li>
                <a href="about.html">About</a>
            </li>

            <li>
                <a href="contact.html">Contact</a>
            </li>

        </ul>

    </nav>

</header>



<!-- =====================================================
     CART SECTION
===================================================== -->

<section class="cart-section">

    <h1>My Cart</h1>


    <div
        id="cart-items"
        class="cart-container"
    >

        <!-- Cart products will be loaded by script.js -->

    </div>

</section>



<!-- =====================================================
     CART SCRIPT
===================================================== -->

<script src="script.js"></script>


<!-- =====================================================
     MOBILE MENU SCRIPT
===================================================== -->

<script>

    const mobileMenuBtn =
        document.getElementById("mobileMenuBtn");

    const navLinks =
        document.getElementById("navLinks");


    mobileMenuBtn.addEventListener("click", function () {

        navLinks.classList.toggle("active");

    });


    /* Close menu after clicking a link */

    const menuLinks =
        navLinks.querySelectorAll("a");

    menuLinks.forEach(function (link) {

        link.addEventListener("click", function () {

            navLinks.classList.remove("active");

        });

    });

</script>


</body>

</html>
