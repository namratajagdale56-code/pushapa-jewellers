<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pushapa Jewellers | Register</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<section class="login-section">

<div class="login-box">

<h1>Create Account</h1>

<p class="login-text">
Register to access Pushapa Jewellers
</p>


<form onsubmit="registerUser(event)">


<input 
type="text"
id="name"
placeholder="Full Name"
required>


<input 
type="email"
id="email"
placeholder="Email Address"
required>


<input 
type="password"
id="password"
placeholder="Password"
required>


<button type="submit">
Register
</button>


</form>


<p>
Already have an account?
<a href="login.html">
Login
</a>
</p>


</div>

</section>


<script src="script.js"></script>

</body>

</html>
