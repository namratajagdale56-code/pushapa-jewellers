<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | Pushapa Jewellers</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            min-height: 100vh;

            font-family: 'Poppins', sans-serif;

            background:
                linear-gradient(
                    rgba(0,0,0,0.72),
                    rgba(0,0,0,0.90)
                ),
                url("images/hero.jpg") center/cover no-repeat;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            color: white;
        }

        .reset-container {

            width: 100%;
            max-width: 450px;

            padding: 45px 40px;

            background: rgba(10,10,10,0.94);

            border: 1px solid rgba(255,215,0,0.45);

            border-radius: 18px;

            box-shadow:
                0 0 25px rgba(255,215,0,0.15),
                0 20px 60px rgba(0,0,0,0.7);

            text-align: center;
        }

        .logo-icon {

            width: 75px;
            height: 75px;

            margin: 0 auto 20px;

            border: 2px solid #d4af37;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #ffd700;

            font-size: 30px;

            box-shadow:
                0 0 20px rgba(255,215,0,0.25);
        }

        h1 {

            font-family: 'Cinzel', serif;

            color: #ffd700;

            font-size: 27px;

            margin-bottom: 10px;
        }

        .subtitle {

            color: #ccc;

            font-size: 14px;

            line-height: 1.7;

            margin-bottom: 30px;
        }

        .input-box {

            position: relative;

            margin-bottom: 20px;
        }

        .input-box i {

            position: absolute;

            left: 16px;

            top: 50%;

            transform: translateY(-50%);

            color: #d4af37;
        }

        .input-box input {

            width: 100%;

            height: 52px;

            padding: 0 48px;

            background: #111;

            border: 1px solid #444;

            border-radius: 8px;

            color: white;

            font-family: 'Poppins', sans-serif;

            font-size: 14px;

            outline: none;

            transition: 0.3s;
        }

        .input-box input:focus {

            border-color: #ffd700;

            box-shadow:
                0 0 12px rgba(255,215,0,0.18);
        }

        .input-box input::placeholder {

            color: #888;
        }

        .show-password {

            position: absolute;

            right: 16px;

            top: 50%;

            transform: translateY(-50%);

            color: #aaa;

            cursor: pointer;

            transition: 0.3s;
        }

        .show-password:hover {

            color: #ffd700;
        }

        .reset-btn {

            width: 100%;

            height: 52px;

            border: none;

            border-radius: 8px;

            background:
                linear-gradient(
                    135deg,
                    #d4af37,
                    #ffd700
                );

            color: #000;

            font-family: 'Poppins', sans-serif;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.3s;
        }

        .reset-btn:hover {

            transform: translateY(-2px);

            box-shadow:
                0 8px 20px rgba(255,215,0,0.25);
        }

        .reset-btn i {

            margin-right: 8px;
        }

        #message {

            margin-top: 18px;

            font-size: 13px;

            min-height: 20px;
        }

        .back-login {

            margin-top: 25px;
        }

        .back-login a {

            color: #ffd700;

            text-decoration: none;

            font-size: 14px;
        }

        .back-login a:hover {

            text-decoration: underline;
        }

        @media (max-width: 500px) {

            body {
                padding: 15px;
            }

            .reset-container {

                padding: 35px 22px;
            }

            h1 {

                font-size: 23px;
            }

            .subtitle {

                font-size: 13px;
            }

            .logo-icon {

                width: 65px;
                height: 65px;

                font-size: 26px;
            }
        }

    </style>

</head>

<body>

    <div class="reset-container">

        <div class="logo-icon">
            <i class="fa-solid fa-key"></i>
        </div>

        <h1>Reset Password</h1>

        <p class="subtitle">
            Create a new secure password for your
            Pushapa Jewellers account.
        </p>


        <form id="resetForm">

            <!-- New Password -->
            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    id="newPassword"
                    placeholder="Enter new password"
                    required
                >

                <i
                    class="fa-solid fa-eye show-password"
                    id="showNewPassword">
                </i>

            </div>


            <!-- Confirm Password -->
            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm new password"
                    required
                >

                <i
                    class="fa-solid fa-eye show-password"
                    id="showConfirmPassword">
                </i>

            </div>


            <button
                type="submit"
                class="reset-btn">

                <i class="fa-solid fa-shield-halved"></i>

                Reset Password

            </button>

        </form>


        <div id="message"></div>


        <div class="back-login">

            <a href="login.html">

                <i class="fa-solid fa-arrow-left"></i>

                Back to Login

            </a>

        </div>

    </div>


<script>

    // ==============================
    // GET RESET TOKEN
    // ==============================

    const urlParams =
        new URLSearchParams(window.location.search);

    const token =
        urlParams.get("token");


    // ==============================
    // SHOW / HIDE PASSWORD
    // ==============================

    document
        .getElementById("showNewPassword")
        .addEventListener("click", function () {

            const password =
                document.getElementById("newPassword");

            if (password.type === "password") {

                password.type = "text";

                this.classList.remove("fa-eye");

                this.classList.add("fa-eye-slash");

            } else {

                password.type = "password";

                this.classList.remove("fa-eye-slash");

                this.classList.add("fa-eye");

            }

        });


    document
        .getElementById("showConfirmPassword")
        .addEventListener("click", function () {

            const password =
                document.getElementById("confirmPassword");

            if (password.type === "password") {

                password.type = "text";

                this.classList.remove("fa-eye");

                this.classList.add("fa-eye-slash");

            } else {

                password.type = "password";

                this.classList.remove("fa-eye-slash");

                this.classList.add("fa-eye");

            }

        });


    // ==============================
    // RESET PASSWORD
    // ==============================

    document
        .getElementById("resetForm")
        .addEventListener("submit", async function (e) {

            e.preventDefault();


            const newPassword =
                document.getElementById("newPassword").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            const message =
                document.getElementById("message");


            // Token check

            if (!token) {

                message.style.color = "#ff5555";

                message.innerText =
                    "Invalid or expired reset link.";

                return;
            }


            // Password match

            if (newPassword !== confirmPassword) {

                message.style.color = "#ff5555";

                message.innerText =
                    "Passwords do not match.";

                return;
            }


            // Password length

            if (newPassword.length < 6) {

                message.style.color = "#ff5555";

                message.innerText =
                    "Password must be at least 6 characters.";

                return;
            }


            const button =
                document.querySelector(".reset-btn");


            button.disabled = true;

            button.innerHTML =
                '<i class="fa-solid fa-spinner fa-spin"></i> Resetting...';


            try {

                const response = await fetch(
                    "http://localhost:5000/api/auth/reset-password",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                                                    },
                            body: JSON.stringify({

                                token: token,

                                newPassword: newPassword

                            })

                    }
                );


                const data =
                    await response.json();


                if (response.ok) {

                    message.style.color =
                        "#ffd700";

                    message.innerText =
                        data.message ||
                        "Password reset successfully.";

                    document
                        .getElementById("resetForm")
                        .reset();


                    setTimeout(function () {

                        window.location.href =
                            "login.html";

                    }, 2000);

                } else {

                    message.style.color =
                        "#ff5555";

                    message.innerText =
                        data.message ||
                        "Password reset failed.";

                }

            } catch (error) {

                console.error(error);

                message.style.color =
                    "#ff5555";

                message.innerText =
                    "Server connection failed.";

            }


            button.disabled = false;

            button.innerHTML =
                '<i class="fa-solid fa-shield-halved"></i> Reset Password';

        });

</script>

</body>

</html>
