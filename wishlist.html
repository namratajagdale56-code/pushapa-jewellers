<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- ================= FONT AWESOME ================= -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <!-- ================= COMMON CSS ================= -->

    <link rel="stylesheet" href="style.css">


    <!-- =====================================================
         WISHLIST PAGE CSS
    ===================================================== -->

    <style>


        /* =====================================================
           PAGE BACKGROUND
        ===================================================== */

        body.wishlist-page {

            min-height: 100vh;

            background-image:

                linear-gradient(
                    90deg,
                    rgba(0,0,0,0.93) 0%,
                    rgba(0,0,0,0.76) 50%,
                    rgba(0,0,0,0.90) 100%
                ),

                url("./images/hero.jpg") !important;

            background-size: cover !important;

            background-position: center center !important;

            background-repeat: no-repeat !important;

            background-attachment: fixed !important;
        }



        /* =====================================================
           WISHLIST SECTION
        ===================================================== */

        .wishlist-section {

            padding: 100px 5% 60px;

            min-height: 100vh;
        }



        /* =====================================================
           TITLE
        ===================================================== */

        .wishlist-title {

            text-align: center;

            margin-bottom: 45px;
        }


        .wishlist-title h1 {

            font-family: "Cinzel", serif;

            color: #d4af37;

            font-size: 42px;

            margin: 0 0 8px;

            letter-spacing: 4px;

            text-shadow:
                0 0 15px rgba(212,175,55,0.18);
        }


        .wishlist-title p {

            color: #9b927d;

            font-family: "Poppins", sans-serif;

            margin: 0;

            font-size: 14px;

            letter-spacing: 1px;
        }


        .wishlist-title::after {

            content: "";

            display: block;

            width: 70px;

            height: 1px;

            background: #d4af37;

            margin: 18px auto 0;

            box-shadow:
                0 0 10px rgba(212,175,55,0.35);
        }



        /* =====================================================
           WISHLIST GRID
        ===================================================== */

        .wishlist-grid {

            width: 100%;

            max-width: 1400px;

            margin: auto;

            display: grid;

            grid-template-columns:
                repeat(4, minmax(0, 1fr));

            gap: 28px;
        }



        /* =====================================================
           PRODUCT CARD
        ===================================================== */

        .wishlist-grid .product-card {

            position: relative;

            background: #080808;

            border: 1px solid #6f5510;

            border-radius: 16px;

            overflow: hidden;

            box-shadow:
                0 0 0 transparent;

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease,
                border-color 0.3s ease;
        }


        .wishlist-grid .product-card:hover {

            transform: translateY(-5px);

            border-color: #d4af37;

            box-shadow:
                0 12px 35px rgba(212,175,55,0.15);
        }



        /* =====================================================
           PRODUCT IMAGE
        ===================================================== */

        .wishlist-grid .product-image-wrap {

            position: relative;

            width: 100%;

            height: 350px;

            overflow: hidden;

            background: #fff;
        }


        .wishlist-grid .product-image-wrap img {

            width: 100%;

            height: 100%;

            object-fit: cover;

            display: block;

            transition:
                transform 0.5s ease;
        }


        .wishlist-grid .product-card:hover
        .product-image-wrap img {

            transform: scale(1.03);
        }



        /* =====================================================
           WISHLIST HEART
        ===================================================== */

        .wishlist-grid .product-wishlist-btn {

            position: absolute;

            top: 14px;

            right: 12px;

            width: 86px;

            height: 36px;

            border-radius: 30px;

            background: #d4af37 !important;

            border: 1px solid #d4af37 !important;

            color: #000;

            display: flex;

            align-items: center;

            justify-content: center;

            cursor: pointer;

            z-index: 5;

            transition: 0.3s ease;
        }


        .wishlist-grid .product-wishlist-btn i {

            color: #000 !important;

            font-size: 17px;
        }


        .wishlist-grid .product-wishlist-btn:hover {

            transform: scale(1.05);
        }



        /* =====================================================
           CARD CONTENT
        ===================================================== */

        .wishlist-grid .product-card-content {

            padding: 16px 24px 18px;

            background: #080808;
        }



        /* =====================================================
           CATEGORY
        ===================================================== */

        .wishlist-grid .product-category {

            color: #d4af37;

            font-family: "Poppins", sans-serif;

            font-size: 12px;

            font-weight: 700;

            letter-spacing: 3px;

            margin-bottom: 10px;
        }



        /* =====================================================
           PRODUCT NAME
        ===================================================== */

        .wishlist-grid .product-name {

            color: #f5e7b2;

            font-family: "Cinzel", serif;

            font-size: 23px;

            font-weight: 700;

            margin: 0 0 12px;

            line-height: 1.2;
        }



        /* =====================================================
           RATING
        ===================================================== */

        .wishlist-grid .product-rating {

            display: flex;

            align-items: center;

            gap: 12px;

            margin-bottom: 12px;
        }


        .wishlist-grid .stars {

            color: #d4af37;

            font-size: 16px;

            letter-spacing: 1px;
        }


        .wishlist-grid .rating-number {

            color: #bbb;

            font-size: 12px;
        }



        /* =====================================================
           PRICE
        ===================================================== */

        .wishlist-grid .price {

            color: #fff;

            font-family: "Poppins", sans-serif;

            font-size: 22px;

            font-weight: 600;

            margin: 0 0 18px;
        }



        /* =====================================================
           BUTTON CONTAINER
        ===================================================== */

        .wishlist-grid .product-buttons {

            display: flex;

            gap: 10px;

            width: 100%;
        }


        .wishlist-grid .product-buttons button {

            height: 52px;

            flex: 1;

            border-radius: 7px;

            font-family: "Poppins", sans-serif;

            font-size: 11px;

            font-weight: 600;

            letter-spacing: 1px;

            cursor: pointer;

            transition: 0.3s ease;

            white-space: nowrap;

            display: flex;

            align-items: center;

            justify-content: center;

            line-height: 1;
        }



        /* =====================================================
           VIEW DETAILS
        ===================================================== */

        .wishlist-grid .view-btn {

            background:
                linear-gradient(
                    135deg,
                    #ffe27a,
                    #d4af37
                );

            border: 1px solid #d4af37;

            color: #080808;

            padding: 0 12px;
        }


        .wishlist-grid .view-btn:hover {

            background:
                linear-gradient(
                    135deg,
                    #fff0a5,
                    #e1bd4b
                );

            transform: translateY(-2px);
        }



        /* =====================================================
           ADD TO CART
        ===================================================== */

        .wishlist-grid .add-cart-btn {

            background: transparent;

            border: 1px solid #8d6f18;

            color: #d4af37;

            padding: 0 12px;
        }


        .wishlist-grid .add-cart-btn:hover {

            background: #d4af37;

            border-color: #d4af37;

            color: #050505;

            box-shadow:
                0 5px 18px rgba(212,175,55,0.25);

            transform: translateY(-2px);
        }



        /* =====================================================
           EMPTY WISHLIST
        ===================================================== */

        .empty-wishlist {

            display: none;

            text-align: center;

            padding: 80px 20px;

            color: #aaa;
        }


        .empty-wishlist i {

            color: #d4af37;

            font-size: 55px;

            margin-bottom: 20px;
        }


        .empty-wishlist h2 {

            color: #f5e7b2;

            font-family: "Cinzel", serif;

            font-size: 28px;

            margin-bottom: 10px;
        }


        .empty-wishlist p {

            margin-bottom: 25px;
        }



        /* =====================================================
           SHOP BUTTON
        ===================================================== */

        .shop-btn {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            padding: 13px 28px;

            background:
                linear-gradient(
                    135deg,
                    #ffe27a,
                    #d4af37
                );

            color: #000;

            text-decoration: none;

            border-radius: 6px;

            font-weight: 600;

            font-size: 13px;
        }



        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 1100px) {

            .wishlist-grid {

                grid-template-columns:
                    repeat(3, minmax(0, 1fr));
            }

        }



        @media (max-width: 800px) {

            .wishlist-grid {

                grid-template-columns:
                    repeat(2, minmax(0, 1fr));

                gap: 18px;
            }


            .wishlist-grid .product-image-wrap {

                height: 280px;
            }


            .wishlist-grid .product-card-content {

                padding: 14px 16px;
            }


            .wishlist-grid .product-name {

                font-size: 18px;
            }


            .wishlist-grid .price {

                font-size: 19px;
            }

        }

@media (max-width: 520px) {

    }

    /* MOBILE = 2 CARDS */

    }

    .wishlist-grid .product-category {

    }

    .wishlist-grid .product-name {

    }

    .wishlist-grid .product-rating {

        margin-bottom: 7px;
    }

    .wishlist-grid .stars {
        font-size: 10px;
    }

    .wishlist-grid .rating-number {
        font-size: 9px;
    }

    .wishlist-grid .price {
        font-size: 14px;
        margin-bottom: 10px;
    }

    .wishlist-grid .product-buttons {
        gap: 5px;
    }

    .wishlist-grid .product-buttons button {
        height: 34px;
        font-size: 8px;
        padding: 0 3px;
        letter-spacing: 0;
    }

    .wishlist-grid .product-wishlist-btn {
        width: 32px;
        height: 32px;
        top: 7px;
        right: 7px;
    }

}/* ==========================================

<!-- =====================================================
     WISHLIST SCRIPT
===================================================== -->

<script>


/* =====================================================
   GET WISHLIST
===================================================== */

function getWishlistProducts() {

    try {

        return JSON.parse(
            localStorage.getItem("wishlist")
        ) || [];

    }

    catch (error) {

        return [];

    }

}



/* =====================================================
   LOAD WISHLIST
===================================================== */

function loadWishlist() {


    const wishlist =
        getWishlistProducts();


    const container =
        document.getElementById(
            "wishlistContainer"
        );


    const empty =
        document.getElementById(
            "emptyWishlist"
        );


    container.innerHTML = "";



    /* =================================================
       EMPTY WISHLIST
    ================================================= */

    if (wishlist.length === 0) {

        empty.style.display = "block";

        return;

    }


    empty.style.display = "none";



    /* =================================================
       PRODUCTS
    ================================================= */

    wishlist.forEach(
        function(product, index) {


            const card =
                document.createElement("div");


            card.className =
                "product-card";



            /* =========================================
               ORIGINAL NAME
            ========================================= */

            const originalProductName =
                product.name ||
                product.title ||
                "JEWELLERY";



            /* =========================================
               CLEAN NAME
            ========================================= */

            const productName =
                String(originalProductName)
                    .replace(/\s*\d+\s*$/, "")
                    .trim()
                    .toUpperCase();



            /* =========================================
               CATEGORY
            ========================================= */

            const category =
                product.category ||
                product.type ||
                "JEWELLERY";



            /* =========================================
               PRICE
            ========================================= */

            const price =
                Number(product.price) || 0;



            /* =========================================
               IMAGE
            ========================================= */

            const image =
                product.image || "";



            /* =========================================
               CARD HTML
            ========================================= */

            card.innerHTML = `


                <!-- IMAGE -->

                <div class="product-image-wrap">


                    <img
                        src="${image}"
                        alt="${productName}"
                        loading="lazy"
                    >



                    <!-- WISHLIST HEART -->

                    <button
                        class="product-wishlist-btn"
                        type="button"
                        title="Remove from Wishlist"
                    >

                        <i class="fa-solid fa-heart"></i>

                    </button>


                </div>



                <!-- CARD CONTENT -->

                <div class="product-card-content">


                    <!-- CATEGORY -->

                    <div class="product-category">

                        ${String(category).toUpperCase()}

                    </div>



                    <!-- NAME -->

                    <h3 class="product-name">

                        ${productName}

                    </h3>



                    <!-- RATING -->

                    <div class="product-rating">

                        <span class="stars">
                            ★★★★★
                        </span>

                        <span class="rating-number">
                            5.0
                        </span>

                    </div>



                    <!-- PRICE -->

                    <p class="price">

                        ₹${price.toLocaleString("en-IN")}

                    </p>



                    <!-- BUTTONS -->

                    <div class="product-buttons">


                        <!-- VIEW DETAILS -->

                        <button
                            class="view-btn"
                            type="button"
                        >

                            VIEW DETAILS

                        </button>



                        <!-- ADD TO CART -->

                        <button
                            class="add-cart-btn"
                            type="button"
                        >

                            ADD TO CART

                        </button>


                    </div>


                </div>

            `;



            /* =================================================
               VIEW DETAILS
            ================================================= */

            const viewButton =
                card.querySelector(
                    ".view-btn"
                );


            viewButton.addEventListener(
                "click",
                function() {


                    localStorage.setItem(

                        "selectedProduct",

                        JSON.stringify({

                            ...product,

                            name:
                                productName,

                            price:
                                price,

                            image:
                                image

                        })

                    );


                    window.location.href =
                        "view-details.html";

                }
            );



            /* =================================================
               ADD TO CART
            ================================================= */

            const addCartButton =
                card.querySelector(
                    ".add-cart-btn"
                );


            addCartButton.addEventListener(
                "click",
                function() {


                    let cart = [];


                    try {

                        cart =
                            JSON.parse(
                                localStorage.getItem("cart")
                            ) || [];

                    }

                    catch(error) {

                        cart = [];

                    }



                    /* =========================================
                       CHECK EXISTING PRODUCT
                    ========================================= */

                    const existingProduct =
                        cart.find(
                            item =>
                                item.name ===
                                originalProductName
                        );



                    /* =========================================
                       ALREADY IN CART
                    ========================================= */

                    if(existingProduct) {

                        existingProduct.quantity =
                            (Number(
                                existingProduct.quantity
                            ) || 1) + 1;

                    }


                    /* =========================================
                       NEW PRODUCT
                    ========================================= */

                    else {

                        cart.push({

                            name:
                                originalProductName,

                            image:
                                image,

                            price:
                                price,

                            category:
                                category,

                            quantity:
                                1

                        });

                    }



                    /* =========================================
                       SAVE CART
                    ========================================= */

                    localStorage.setItem(

                        "cart",

                        JSON.stringify(cart)

                    );



                    /* =========================================
                       UPDATE CART COUNT
                    ========================================= */

                    if(
                        typeof updateCartCount ===
                        "function"
                    ) {

                        updateCartCount();

                    }



                    /* =========================================
                       BUTTON FEEDBACK
                    ========================================= */
                    showPremiumAlert("Product added successfully!", "cart");
                    addCartButton.textContent =
                        "ADDED TO CART";


                    addCartButton.style.background =
                        "#d4af37";


                    addCartButton.style.color =
                        "#050505";


                    setTimeout(
                        function() {

                            addCartButton.textContent =
                                "ADD TO CART";


                            addCartButton.style.background =
                                "transparent";


                            addCartButton.style.color =
                                "#d4af37";

                        },
                        1200
                    );


                }
            );



            /* =================================================
               WISHLIST HEART
               CLICK = DELETE FROM WISHLIST
            ================================================= */

            const wishlistButton =
                card.querySelector(
                    ".product-wishlist-btn"
                );


            wishlistButton.addEventListener(
                "click",
                function(event) {


                    event.preventDefault();

                    event.stopPropagation();



                    let currentWishlist =
                        getWishlistProducts();



                    /* =========================================
                       REMOVE THIS PRODUCT
                    ========================================= */

                    currentWishlist.splice(
                        index,
                        1
                    );



                    /* =========================================
                       SAVE
                    ========================================= */

                    localStorage.setItem(

                        "wishlist",

                        JSON.stringify(
                            currentWishlist
                        )

                    );



                    /* =========================================
                       RELOAD CARDS
                    ========================================= */
                    showPremiumAlert("Product removed from wishlist!", "wishlist");
                    loadWishlist();


                }
            );



            /* ================================================
               ADD CARD
            ================================================= */

            container.appendChild(card);


        }
    );


}



/* =====================================================
   PAGE LOAD
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function() {


        loadWishlist();



        /* =========================================
           UPDATE CART COUNT
        ========================================= */

        if(
            typeof updateCartCount ===
            "function"
        ) {

            updateCartCount();

        }


    }
);


</script>
